[package]
name = "slovo-core"
description = "Storage, ingestion and query engine for Slovo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dirs = "7.0.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slovo-dataset = { version = "0.1.0", path = "../slovo-dataset" }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
