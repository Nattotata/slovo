[package]
name = "slovo-cli"
description = "Command-line interface for Slovo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "slovo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slovo-core = { version = "0.1.0", path = "../slovo-core" }
slovo-annotate = { version = "0.1.0", path = "../slovo-annotate" }
slovo-dataset = { version = "0.1.0", path = "../slovo-dataset" }
slovo-fetch = { version = "0.1.0", path = "../slovo-fetch" }
slovo-server = { version = "0.1.0", path = "../slovo-server" }
slovo-service = { version = "0.1.0", path = "../slovo-service" }

[dev-dependencies]
