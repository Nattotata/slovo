[package]
name = "slovo-server"
description = "HTTP API over the Slovo engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
slovo-core = { version = "0.1.0", path = "../slovo-core" }
slovo-service = { version = "0.1.0", path = "../slovo-service" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }
tower-http = { version = "0.7.1", features = ["cors"] }

[dev-dependencies]
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
